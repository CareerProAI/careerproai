<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="CareerProAI — AI-powered resume scanning, ATS compliance analysis, and job-match discovery." />
    <meta name="theme-color" content="#004492" />
    <meta property="og:title" content="CareerProAI - Enterprise Suite" />
    <meta property="og:description" content="AI-powered resume scanning, ATS compliance analysis, and job-match discovery." />
    <meta property="og:type" content="website" />
    <title>CareerProAI - Enterprise Suite</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23004492' width='32' height='32' rx='6'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23fff' font-size='16' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E" />
    <script>
      {
        const colorScheme = localStorage.getItem('talentai-color-scheme');
        if (colorScheme === 'light' || colorScheme === 'dark') {
          document.documentElement.classList.add(colorScheme);
          const meta = document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.content = colorScheme;
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-on-background font-sans antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
